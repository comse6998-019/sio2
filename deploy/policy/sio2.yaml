version: 1

filesystem_policy:
  include_workdir: false

  read_only:
    - /bin
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
    - /opt/sio2
    - /inputs
    - /sandbox

  read_write:
    - /sandbox/runs
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies: {}
